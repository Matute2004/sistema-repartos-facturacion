name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          TURSO_DATABASE_URLL: ${{ secrets.TURSO_DATABASE_URLL }}
          TURSO_AUTH_TOKENN: ${{ secrets.TURSO_AUTH_TOKENN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}